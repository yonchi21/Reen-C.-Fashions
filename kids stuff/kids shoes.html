<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../reen.css">
  <title>KIDS SHOES SECTION</title>
</head>
<body>
  <div id="page-loader" class="page-loader" aria-hidden="true">
    <span class="page-loader__mark">REEN C. FASHION</span>
    <div class="page-loader__spinner"></div>
  </div>

  <header class="cover" id="section-name">👟KIDS SHOES Section</header>
  <main>
    <section class="page" data-cat="kids" id="kids">
    <div class="grid">
      
    </div>
  </section>

  </main>
  <footer class="contact" id="contact">
  <h2 class="contact__title">Ready to order?</h2>
  <p class="contact__sub">Send a message with the item you'd like, and we'll sort out size, colour, and delivery.</p>
  <div id="selected-items" class="selected-items"></div>
  <p class="order-summary">Selected total: <span id="total-price">MK 0</span></p>
  <div class="contact__actions">
    <a class="contact__btn contact__btn--whatsapp is-disabled" id="whatsapp-btn" href="#" target="_blank" rel="noopener">💬 Select item(s) to order</a>
    <a class="contact__btn contact__btn--phone" id="phone-btn" href="#">📞 Call to order</a>
  </div>
  </footer>
  <script src="../reen.js">

</script>
</body>
</html>
